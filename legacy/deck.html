<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Deck — AltSpot Capital</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="page"></main>
</div>

<script src="assets/store.js"></script>
<script src="data/deals.js"></script>
<script src="assets/app.js"></script>
<script>
  const u = ASC.requireAuth(); if (!u) throw new Error('auth');
  ASCUI.shell('marketplace');

  const d = dealById(ASC.qs('id'));
  if (!d) { document.getElementById('page').innerHTML = '<p class="sub">Deck not found. <a href="marketplace.html">Back to marketplace</a>.</p>'; throw new Error('nodeck'); }
  document.title = d.name + ' — Pitch Deck';

  const slides = d.deck.map(function (s, i) {
    const stats = s.stats ? '<div class="statrow">' + s.stats.map(function (st) {
      return '<div class="stat"><div class="k">' + st.k + '</div><div class="v num" style="font-size:26px">' + st.v + '</div></div>';
    }).join('') + '</div>' : '';
    return '<section class="card slide"' + (i === 0 ? ' style="background:linear-gradient(160deg,rgba(201,161,74,.10),var(--panel))"' : '') + '>' +
      '<div class="eyebrow k">' + s.kicker + ' · ' + (i + 1) + ' / ' + d.deck.length + '</div>' +
      '<h2>' + s.title + '</h2>' +
      s.body.map(function (p) { return '<p>' + p + '</p>'; }).join('') +
      stats + '</section>';
  }).join('');

  document.getElementById('page').innerHTML =
    '<div class="crumbs" style="justify-content:space-between;display:flex">' +
      '<span><a href="marketplace.html">Marketplace</a><span class="sep"> / </span>' +
      '<a href="deal.html?id=' + d.id + '">' + d.name + '</a><span class="sep"> / </span>' +
      '<span class="here">Pitch deck</span></span>' +
      '<span style="display:flex;gap:16px">' +
        '<a href="deck.html?id=' + d.id + '" target="_blank" rel="noopener">Open in new tab ↗</a>' +
        '<a href="deal.html?id=' + d.id + '">← Back to deal</a>' +
      '</span>' +
    '</div>' +
    slides +
    '<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">' +
      '<div><h3>' + d.name + '</h3><p class="small" style="margin-top:4px">Minimum ' + ASC.money(d.minInvestment) + ' · AltSpot committed ' + ASC.money(d.altspotCommitted) + '</p></div>' +
      '<div style="display:flex;gap:10px"><button class="btn btn-gold" onclick="ASCUI.gateInvest(\'' + d.id + '\')">Begin investment</button>' +
      '<a class="btn btn-ghost" href="deal.html?id=' + d.id + '">Deal overview</a></div>' +
    '</div>' +
    '<p class="tiny" style="margin-top:18px">Prepared by AltSpot Capital from company-provided materials and AltSpot diligence. Not an offer except through definitive documents. Demo — fictional company.</p>';
</script>
</body>
</html>
